<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Analyzer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f17;
        color: #e2e8f0;
        font-size: 13px;
      }

      .header {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        padding: 14px 16px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
      }

      .header p {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 1px;
      }

      .icon {
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 5px;
      }

      input[type='url'] {
        width: 100%;
        background: #1e1e2e;
        border: 1px solid #2d2d3f;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 12px;
        padding: 8px 10px;
        outline: none;
        transition: border-color 0.15s;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }

      input[type='url']:focus {
        border-color: #6366f1;
      }

      .btn-row {
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: opacity 0.15s;
      }

      button:hover {
        opacity: 0.85;
      }

      .btn-save {
        background: #6366f1;
        color: #fff;
      }

      .btn-reset {
        background: #1e1e2e;
        color: #94a3b8;
        border: 1px solid #2d2d3f;
      }

      .status {
        font-size: 11px;
        color: #6366f1;
        min-height: 16px;
        text-align: center;
      }

      .divider {
        border: none;
        border-top: 1px solid #1e1e2e;
      }

      .hint {
        font-size: 11px;
        color: #475569;
        line-height: 1.5;
      }

      .hint strong {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="icon">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z" />
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />
        </svg>
      </div>
      <div>
        <h1>AI Job Analyzer</h1>
        <p>LinkedIn → AI analysis in one click</p>
      </div>
    </div>

    <div class="body">
      <div>
        <label for="appUrl">App URL</label>
        <input type="url" id="appUrl" placeholder="https://your-app.vercel.app" />
      </div>

      <div class="btn-row">
        <button class="btn-save" id="save">Save</button>
        <button class="btn-reset" id="reset">Reset</button>
      </div>

      <div class="status" id="status"></div>

      <hr class="divider" />

      <p class="hint">
        Navigate to any <strong>LinkedIn job posting</strong> and click the
        <strong>"Analyze with AI"</strong> button in the bottom-right corner of the page.
      </p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
